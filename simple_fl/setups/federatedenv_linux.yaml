name: stadleenv
channels:
  - defaults

dependencies:
  - python=3.9
  - pip

  # Core libs (let conda auto-select correct Linux versions)
  - libgcc-ng
  - libstdcxx-ng
  - sqlite
  - tk
  - readline
  - ncurses
  - openssl
  - zlib
  - xz

  # MKL optional (Linux-compatible)
  - mkl
  - mkl-service
  - blas=1.0=mkl

  # Numpy stack (auto selects correct build)
  - numpy
  - numpy-base

  # Packaging tools
  - setuptools
  - wheel
  - six

  - pip:
      - getmac==0.9.4
      - websockets==12.0
      - flask==3.0.3
      - flask-cors==4.0.1
      - requests==2.32.3
      - gunicorn==22.0.0
      - sqlalchemy==2.0.23
      - flask_sqlalchemy
      - authlib==1.3.1
      - ip2geotools
      - python-dotenv 
